name: Sync source to Gitee

on:
  push:
    branches:
      - main

concurrency:
  group: sync-gitee-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify Gitee API token
        env:
          GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
        shell: bash
        run: |
          curl -fsS \
            -H "Authorization: Bearer $GITEE_ACCESS_TOKEN" \
            https://gitee.com/api/v5/repos/daotuke/z3cz \
            | jq -e '.full_name == "daotuke/z3cz"' >/dev/null

      - name: Synchronize Gitee main
        env:
          GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
        run: bash scripts/release/sync-gitee-git.sh "$GITHUB_SHA"
