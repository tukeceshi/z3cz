name: Sync source to Gitee

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional existing release tag to resynchronize
        required: false
        type: string

concurrency:
  group: sync-gitee-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify Gitee API token
        env:
          GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
        shell: bash
        run: |
          curl -fsS \
            -H "Authorization: Bearer $GITEE_ACCESS_TOKEN" \
            https://gitee.com/api/v5/repos/daotuke/z3cz \
            | jq -e '.full_name == "daotuke/z3cz"' >/dev/null

      - name: Synchronize Gitee main
        env:
          GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
        run: bash scripts/release/sync-gitee-git.sh "$GITHUB_SHA"

      - name: Recover an existing release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" >/dev/null
          mkdir -p dist/recovery
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > dist/recovery/release.json
          jq -r '.body // ""' dist/recovery/release.json > dist/recovery/RELEASE_NOTES.md
          release_id="$(jq -er '.id' dist/recovery/release.json)"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" > dist/recovery/assets.json
          for asset_name in "z3cz-${RELEASE_TAG}-deploy.tar.gz" SHA256SUMS; do
            asset_url="$(jq -er --arg name "$asset_name" '.[] | select(.name == $name) | .url' dist/recovery/assets.json)"
            gh api \
              -H 'Accept: application/octet-stream' \
              "$asset_url" > "dist/recovery/$asset_name"
            test -s "dist/recovery/$asset_name"
          done
          bash scripts/release/sync-gitee-git.sh "$GITHUB_SHA" "$RELEASE_TAG"
          bash scripts/release/sync-gitee-release.sh \
            "$RELEASE_TAG" \
            dist/recovery/RELEASE_NOTES.md \
            "dist/recovery/z3cz-${RELEASE_TAG}-deploy.tar.gz" \
            dist/recovery/SHA256SUMS
