name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify VERSION and changelog
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" == "$GITHUB_REF_NAME" ]] || {
            echo "VERSION=$version does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          }
          grep -Fqx "## $version" CHANGELOG.md || {
            echo "CHANGELOG.md is missing ## $version" >&2
            exit 1
          }
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "VERSION is not a release version: $version" >&2
            exit 1
          }

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - run: pnpm install --frozen-lockfile

      - name: Verify update policy
        run: node scripts/host/validate-update-policy.mjs

      - name: Build immutable deployment package
        run: bash scripts/host/pack-deploy.sh

      - name: Prepare release notes
        shell: bash
        run: |
          version="$GITHUB_REF_NAME"
          awk -v heading="## $version" '
            $0 == heading { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md || printf 'z3cz %s\n' "$version" > RELEASE_NOTES.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to replace immutable assets" >&2
            exit 1
          else
            prerelease_args=()
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              prerelease_args+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" \
              "dist/deploy/z3cz-${GITHUB_REF_NAME}-deploy.tar.gz" \
              dist/deploy/SHA256SUMS \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes-file RELEASE_NOTES.md \
              "${prerelease_args[@]}"
          fi
