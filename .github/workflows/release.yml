name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify VERSION and changelog
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" == "$GITHUB_REF_NAME" ]] || {
            echo "VERSION=$version does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          }
          grep -Fqx "## $version" CHANGELOG.md || {
            echo "CHANGELOG.md is missing ## $version" >&2
            exit 1
          }

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"

      - name: Verify update policy
        run: bun scripts/host/validate-update-policy.mjs

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Publish base environment and pack source updater
        env:
          DAFTHUNK_PUSH_IMAGES: "1"
          DAFTHUNK_RELEASE: "1"
        run: bash scripts/host/pack-deploy.sh

      - name: Prepare release notes
        shell: bash
        run: |
          version="$GITHUB_REF_NAME"
          awk -v heading="## $version" '
            $0 == heading { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md || printf 'z3cz %s\n' "$version" > RELEASE_NOTES.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prerelease_args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            z3cz-deploy.tar.gz \
            dist/z3cz-host-updater-linux-amd64 \
            dist/z3cz-host-updater-linux-arm64 \
            dist/SHA256SUMS \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            "${prerelease_args[@]}"
