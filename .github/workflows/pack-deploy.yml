name: Pack deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build, push, pack host files
        env:
          DAFTHUNK_PUSH_IMAGES: "1"
          DAFTHUNK_API_IMAGE: tukeceshi/z3cz-api:latest
          DAFTHUNK_APP_IMAGE: tukeceshi/z3cz-app:latest
        run: bash scripts/host/pack-deploy.sh

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: self-host
          name: Self-host
          body: Deploy pack from ${{ github.sha }}
          files: z3cz-deploy.tar.gz
          fail_on_unmatched_files: true
          make_latest: true
          target_commitish: ${{ github.sha }}
