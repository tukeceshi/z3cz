name: Pack deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build native server archives
        run: bash scripts/host/pack-deploy.sh

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: self-host
          name: Self-host
          body: Deploy pack from ${{ github.sha }}
          files: |
            dist/native/z3cz-server-linux-amd64.tar.gz
            dist/native/z3cz-server-linux-arm64.tar.gz
            dist/native/SHA256SUMS
          fail_on_unmatched_files: true
          make_latest: false
          target_commitish: ${{ github.sha }}
