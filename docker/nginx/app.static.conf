# Host / Caddy 入口下的 SPA：仅静态资源，/api 由上游 Caddy 反代。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
