# Production release runtime. Copied into each release as compose.yml.
name: z3cz

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16.6-alpine@sha256:1d04b9ba1d4996401f2552b51beda8187f175c0645c091e4781134fc9c9a3eef}
    environment:
      POSTGRES_USER: z3cz
      POSTGRES_DB: z3cz
    # Legacy updaters supply a file; new deployers supply a password-only directory.
    # Both paths use the existing password, never reinitialize an existing database.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ -d /run/z3cz-password ]; then
          export POSTGRES_PASSWORD_FILE=/run/z3cz-password/postgres.password
        else
          export POSTGRES_PASSWORD_FILE=/run/z3cz-password
        fi
        exec docker-entrypoint.sh postgres
    volumes:
      # 目录必须已存在。引擎冷启动时若自动创建空目录，会把现有库初始化成新库。
      - type: bind
        source: /var/lib/z3cz/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
      - type: bind
        source: ${Z3CZ_POSTGRES_PASSWORD_FILE:-/etc/z3cz/postgres.password}
        target: /run/z3cz-password
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U z3cz -d z3cz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: ${Z3CZ_RESTART_POLICY:-always}
    stop_grace_period: 60s
    logging: *logging

  # Node 镜像没有 docker。只挂域名重建需要的路径，再 chroot 进 /host。
  # 不要挂整棵 /：其中的 /mnt 与 WSL 盘符在整机重启时经常尚未就绪，
  # 挂载失败发生在进程启动前，重启策略不会再重试。
  site-address:
    image: ${NODE_IMAGE:-node:22.12.0-bookworm-slim@sha256:35531c52ce27b6575d69755c73e65d4468dba93a25644eed56dc12879cae9213}
    command: ["node", "/srv/scripts/site-address-server.mjs"]
    cap_add:
      - SYS_CHROOT
    environment:
      Z3CZ_HOST_ROOT: /host
      Z3CZ_ENV_FILE: ${Z3CZ_ENV_FILE:-/etc/z3cz/z3cz.env}
      Z3CZ_INSTALL_DIR: /opt/z3cz
      Z3CZ_SITE_ADDRESS_SOCKET: /run/z3cz-site/site.sock
      Z3CZ_DOCKER_CLI: ${Z3CZ_DOCKER_CLI:-/usr/bin/docker}
      Z3CZ_DOCKER_COMPOSE_PLUGIN: ${Z3CZ_DOCKER_COMPOSE_PLUGIN:-/usr/libexec/docker/cli-plugins/docker-compose}
      Z3CZ_DOCKER_SOCKET: ${Z3CZ_DOCKER_SOCKET:-/var/run/docker.sock}
      Z3CZ_HOST_LIB: ${Z3CZ_HOST_LIB:-/lib}
      Z3CZ_HOST_USRLIB: ${Z3CZ_HOST_USRLIB:-/usr/lib}
      Z3CZ_HOST_LIB64: ${Z3CZ_HOST_LIB64:-/lib64}
    volumes:
      - type: bind
        source: /opt/z3cz
        target: /host/opt/z3cz
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /etc/z3cz
        target: /host/etc/z3cz
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/z3cz
        target: /host/var/lib/z3cz
        read_only: true
        bind:
          create_host_path: false
      - /run/z3cz-site:/host/run/z3cz-site
      - /run/z3cz-updater:/host/run/z3cz-updater
      - type: bind
        source: ${Z3CZ_DOCKER_CLI:-/usr/bin/docker}
        target: /host/usr/bin/docker
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${Z3CZ_DOCKER_COMPOSE_PLUGIN:-/usr/libexec/docker/cli-plugins/docker-compose}
        target: /host/usr/libexec/docker/cli-plugins/docker-compose
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${Z3CZ_DOCKER_SOCKET:-/var/run/docker.sock}
        target: /host/var/run/docker.sock
        bind:
          create_host_path: false
      - type: bind
        source: ${Z3CZ_HOST_LIB:-/lib}
        target: /host/lib
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${Z3CZ_HOST_USRLIB:-/usr/lib}
        target: /host/usr/lib
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${Z3CZ_HOST_LIB64:-/lib64}
        target: /host/lib64
        read_only: true
        bind:
          create_host_path: false
      - /run/z3cz-site:/run/z3cz-site
      - ${Z3CZ_RELEASE_DIR:?set Z3CZ_RELEASE_DIR}/scripts:/srv/scripts:ro
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('node:net').connect('/run/z3cz-site/site.sock');s.setTimeout(3000);s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));s.on('timeout',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: ${Z3CZ_RESTART_POLICY:-always}
    init: true
    stop_grace_period: 30s
    logging: *logging

  api:
    image: ${NODE_IMAGE:-node:22.12.0-bookworm-slim@sha256:35531c52ce27b6575d69755c73e65d4468dba93a25644eed56dc12879cae9213}
    working_dir: /app
    command: ["node", "dist/server.mjs"]
    env_file: ${Z3CZ_ENV_FILE:-/etc/z3cz/z3cz.env}
    environment:
      POSTGRES_WAIT_FOREVER: "1"
    depends_on:
      postgres:
        condition: service_healthy
      site-address:
        condition: service_healthy
    volumes:
      - ${Z3CZ_RELEASE_DIR:?set Z3CZ_RELEASE_DIR}/api:/app:ro
      - ${Z3CZ_RELEASE_DIR:?set Z3CZ_RELEASE_DIR}/app:/srv/app:ro
      - /var/lib/z3cz/uploads:/var/lib/z3cz/uploads
      - /var/lib/z3cz/maintenance:/var/lib/z3cz/maintenance:ro
      - /run/z3cz-site:/run/z3cz-site
      - /run/z3cz-updater:/run/z3cz-updater
      - /var/lib/z3cz/update:/var/lib/z3cz/update
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/ready',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    restart: ${Z3CZ_RESTART_POLICY:-always}
    init: true
    stop_grace_period: 30s
    logging: *logging

  caddy:
    image: ${CADDY_IMAGE:-caddy:2.9.1-alpine@sha256:b4e3952384eb9524a887633ce65c752dd7c71314d2c2acf98cd5c715aaa534f0}
    env_file: ${Z3CZ_ENV_FILE:-/etc/z3cz/z3cz.env}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ${Z3CZ_RELEASE_DIR:?set Z3CZ_RELEASE_DIR}/caddy:/etc/caddy:ro
      - ${Z3CZ_RELEASE_DIR:?set Z3CZ_RELEASE_DIR}/app:/srv/app:ro
      - /var/lib/z3cz/maintenance:/srv/maintenance:ro
      - /var/lib/z3cz/caddy/data:/data
      - /var/lib/z3cz/caddy/config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: ${Z3CZ_RESTART_POLICY:-always}
    stop_grace_period: 30s
    logging: *logging
