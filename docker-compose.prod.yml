# 源码命令部署：Postgres + API + App + Caddy。
# 启动：docker compose -f docker-compose.prod.yml up -d --build --wait

name: z3cz-prod

x-prod-build-args: &prod-build-args
  NODE_VERSION: ${NODE_VERSION:-22.12.0}
  PNPM_VERSION: ${PNPM_VERSION:-10.3.0}
  NODE_MAX_OLD_SPACE_SIZE: ${NODE_MAX_OLD_SPACE_SIZE:-2048}
  VITE_API_HOST: /api
  VITE_WEBSITE_URL: ${VITE_WEBSITE_URL:-http://localhost:8080}
  VITE_APP_URL: ${VITE_APP_URL:-http://localhost:8080}
  VITE_WS_VIA_PROXY: "1"

services:
  supabase-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - dafthunk_prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod-api
      args:
        <<: *prod-build-args
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      RUNTIME: docker
      HOST: 0.0.0.0
      PORT: 3001
      SECRETS_FILE: /data/secrets/.dev.vars
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@supabase-db:5432/${POSTGRES_DB:-postgres}
      LOCAL_STORAGE_PATH: /app/data/storage
      RUN_DB_MIGRATE: ${RUN_DB_MIGRATE:-true}
      WEB_HOST: ${WEB_HOST:-http://localhost:8080}
      WEBSITE_URL: ${WEBSITE_URL:-http://localhost:8080}
      EMAIL_DOMAIN: ${EMAIL_DOMAIN:-mail.dafthunk.com}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ENV: ${CLOUDFLARE_ENV:-production}
    volumes:
      - dafthunk_prod_storage:/app/data/storage
      - dafthunk_prod_secrets:/data/secrets
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod-app
      args:
        <<: *prod-build-args
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./docker/nginx/app.static.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  caddy:
    image: caddy:2.9-alpine
    depends_on:
      - app
      - api
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/Caddyfile.prod:/etc/caddy/Caddyfile:ro
    restart: unless-stopped

volumes:
  dafthunk_prod_postgres_data:
  dafthunk_prod_storage:
  dafthunk_prod_secrets:
