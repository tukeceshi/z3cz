# 全容器开发栈：Postgres + API + app；仅 Caddy 网关发布到宿主机 3000。
#
# 启动：docker compose up -d --build --wait
# 状态：docker compose ps
# 日志：docker compose logs -f api app
# 恢复：docker compose up -d --wait
# 清空全部开发数据（包括数据库）：docker compose down -v
# 单容器旧模式：docker compose --profile monolith up -d --build
#
# node_modules：每服务独立命名卷（方案 I），避免并行 pnpm install 竞态与 HMR 失效。
# 升级旧依赖卷时仅重建对应 node_modules 卷，不删除数据库卷。

x-dev-logging: &dev-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  supabase-db:
    image: postgres:16-alpine
    container_name: dafthunk-pg-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - dafthunk_postgres_data:/var/lib/postgresql/data
    networks:
      - dafthunk-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 60s
    logging: *dev-logging
    restart: always

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev-api
      args:
        NODE_VERSION: ${NODE_VERSION:-22.12.0}
        PNPM_VERSION: ${PNPM_VERSION:-10.3.0}
    image: dafthunk-dev-api:local
    container_name: dafthunk-api-dev
    depends_on:
      supabase-db:
        condition: service_healthy
        restart: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - dafthunk_node_modules_api_root:/app/node_modules
      - dafthunk_node_modules_api:/app/apps/api/node_modules
      # 遮盖宿主机兄弟包 / packages node_modules，避免 Windows 路径泄漏进 Linux 容器
      - dafthunk_node_modules_api_mask_app:/app/apps/app/node_modules
      - dafthunk_node_modules_api_runtime:/app/packages/runtime/node_modules
      - dafthunk_node_modules_api_geo:/app/packages/geo/node_modules
      - dafthunk_node_modules_api_types:/app/packages/types/node_modules
      - dafthunk_node_modules_api_utils:/app/packages/utils/node_modules
      - dafthunk_pnpm_store:/pnpm/store
      - dafthunk_local_storage:/app/data/storage
      - dafthunk_secrets:/data/secrets
      - ./logs:/app/logs
    env_file:
      - path: .env.docker
        required: false
    environment:
      DAFTHUNK_SERVICE: api
      POSTGRES_WAIT_FOREVER: "1"
      RUNTIME: docker
      SECRETS_FILE: /data/secrets/.dev.vars
      DEV_VARS_FILE: /app/apps/api/.dev.vars
      DATABASE_URL: postgresql://postgres:postgres@supabase-db:5432/postgres
      LOCAL_STORAGE_PATH: /app/data/storage
      PORT: 3001
      WEB_HOST: http://localhost:${APP_PORT:-3000}
      WEBSITE_URL: http://localhost:${APP_PORT:-3000}
      HOST: 0.0.0.0
      SKIP_EXTRACT_NODES: "1"
      # tsx watch process restarts: skip migrate when boot stamp matches journal.
      SKIP_DB_MIGRATE: "1"
      # Windows bind mounts often miss inotify events; tsx watch uses chokidar.
      CHOKIDAR_USEPOLLING: "1"
      CHOKIDAR_INTERVAL: "300"
      BOOTSTRAP_ASSETS_DIR: /app/apps/app/dist
    networks:
      - dafthunk-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/health/ready', {signal: AbortSignal.timeout(3000)}).then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    logging: *dev-logging
    restart: always
    init: true
    stop_grace_period: 30s
    stdin_open: true
    tty: true

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev-app
      args:
        NODE_VERSION: ${NODE_VERSION:-22.12.0}
        PNPM_VERSION: ${PNPM_VERSION:-10.3.0}
    image: dafthunk-dev-app:local
    container_name: dafthunk-app-dev
    depends_on:
      api:
        condition: service_healthy
        restart: true
    volumes:
      - .:/app
      - dafthunk_node_modules_app_root:/app/node_modules
      - dafthunk_node_modules_app:/app/apps/app/node_modules
      - dafthunk_node_modules_app_mask_api:/app/apps/api/node_modules
      - dafthunk_pnpm_store:/pnpm/store
    env_file:
      - path: .env.docker
        required: false
    environment:
      DAFTHUNK_SERVICE: app
      API_WAIT_TIMEOUT_SEC: "300"
      API_PROXY_TARGET: http://api:3001
      # Browser requests stay same-origin through Caddy at localhost:3000.
      VITE_API_HOST: /api
      VITE_WS_VIA_PROXY: "1"
      HOST: 0.0.0.0
      SKIP_EXTRACT_NODES: "1"
    networks:
      - dafthunk-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health', {signal: AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    logging: *dev-logging
    restart: always
    init: true
    stop_grace_period: 30s
    stdin_open: true
    tty: true

  # The sole browser entry point. API and Vite stay on the Docker network.
  # Browser: http://localhost:3000
  caddy-gateway:
    image: caddy:2.9-alpine
    container_name: dafthunk-caddy-gateway-dev
    depends_on:
      app:
        condition: service_healthy
      api:
        condition: service_healthy
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://127.0.0.1:8080/health && wget -q -T 3 -O /dev/null http://127.0.0.1:8080/api/health/ready"]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 30s
    ports:
      - "${APP_PORT:-3000}:8080"
    volumes:
      - ./docker/caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
    networks:
      - dafthunk-network
    logging: *dev-logging
    restart: always

networks:
  dafthunk-network:
    driver: bridge

volumes:
  # 方案 I：按服务隔离 root + 包级 node_modules
  dafthunk_node_modules_api_root:
  dafthunk_node_modules_api:
  dafthunk_node_modules_api_mask_app:
  dafthunk_node_modules_api_runtime:
  dafthunk_node_modules_api_geo:
  dafthunk_node_modules_api_types:
  dafthunk_node_modules_api_utils:
  dafthunk_node_modules_app_root:
  dafthunk_node_modules_app:
  dafthunk_node_modules_app_mask_api:
  dafthunk_pnpm_store:
  dafthunk_postgres_data:
  dafthunk_local_storage:
  dafthunk_secrets:
