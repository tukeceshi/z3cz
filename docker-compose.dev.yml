# 全容器开发栈：Postgres + API + www + app（3100 / 3101 / 3102 均在容器内）
#
# 启动：docker compose up -d --build --wait
# 状态：docker compose ps
# 日志：docker compose logs -f api www app
# 重置：docker compose down -v
# 单容器旧模式：docker compose --profile monolith up -d --build
#
# node_modules：每服务独立命名卷（方案 I），避免并行 pnpm install 竞态与 HMR 失效。
# 升级自旧共享卷 dafthunk_node_modules 后请执行一次：docker compose down -v

services:
  supabase-db:
    image: postgres:16-alpine
    container_name: dafthunk-pg-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - dafthunk_postgres_data:/var/lib/postgresql/data
    networks:
      - dafthunk-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev-api
      args:
        NODE_VERSION: ${NODE_VERSION:-22.12.0}
        PNPM_VERSION: ${PNPM_VERSION:-10.3.0}
    image: dafthunk-dev-api:local
    container_name: dafthunk-api-dev
    depends_on:
      supabase-db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-3102}:3102"
    volumes:
      - .:/app
      - dafthunk_node_modules_api_root:/app/node_modules
      - dafthunk_node_modules_api:/app/apps/api/node_modules
      # 遮盖宿主机兄弟包 node_modules，避免 Windows 路径泄漏进 Linux 容器
      - dafthunk_node_modules_api_mask_www:/app/apps/www/node_modules
      - dafthunk_node_modules_api_mask_app:/app/apps/app/node_modules
      - dafthunk_pnpm_store:/pnpm/store
      - dafthunk_local_storage:/app/data/storage
      - dafthunk_secrets:/data/secrets
      - ./logs:/app/logs
    env_file:
      - path: .env.docker
        required: false
    environment:
      DAFTHUNK_SERVICE: api
      RUNTIME: docker
      SECRETS_FILE: /data/secrets/.dev.vars
      DEV_VARS_FILE: /app/apps/api/.dev.vars
      DATABASE_URL: postgresql://postgres:postgres@supabase-db:5432/postgres
      LOCAL_STORAGE_PATH: /app/data/storage
      HOST: 0.0.0.0
      SKIP_EXTRACT_NODES: "1"
    networks:
      - dafthunk-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3102/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 360s
    restart: on-failure:5
    stdin_open: true
    tty: true

  www:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev-www
      args:
        NODE_VERSION: ${NODE_VERSION:-22.12.0}
        PNPM_VERSION: ${PNPM_VERSION:-10.3.0}
    image: dafthunk-dev-www:local
    container_name: dafthunk-www-dev
    depends_on:
      api:
        condition: service_healthy
      supabase-db:
        condition: service_healthy
    ports:
      - "${WWW_PORT:-3100}:3100"
    volumes:
      - .:/app
      - dafthunk_node_modules_www_root:/app/node_modules
      - dafthunk_node_modules_www:/app/apps/www/node_modules
      - dafthunk_node_modules_www_mask_app:/app/apps/app/node_modules
      - dafthunk_node_modules_www_mask_api:/app/apps/api/node_modules
      - dafthunk_pnpm_store:/pnpm/store
    env_file:
      - path: .env.docker
        required: false
    environment:
      DAFTHUNK_SERVICE: www
      HOST: 0.0.0.0
      # www 需要 nodes.json；entrypoint 按源文件哈希决定是否 extract（方案 II）
      SKIP_EXTRACT_NODES: "0"
    networks:
      - dafthunk-network
    restart: on-failure:5
    stdin_open: true
    tty: true

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev-app
      args:
        NODE_VERSION: ${NODE_VERSION:-22.12.0}
        PNPM_VERSION: ${PNPM_VERSION:-10.3.0}
    image: dafthunk-dev-app:local
    container_name: dafthunk-app-dev
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3101}:3101"
    volumes:
      - .:/app
      - dafthunk_node_modules_app_root:/app/node_modules
      - dafthunk_node_modules_app:/app/apps/app/node_modules
      - dafthunk_node_modules_app_mask_www:/app/apps/www/node_modules
      - dafthunk_node_modules_app_mask_api:/app/apps/api/node_modules
      - dafthunk_pnpm_store:/pnpm/store
    env_file:
      - path: .env.docker
        required: false
    environment:
      DAFTHUNK_SERVICE: app
      API_PROXY_TARGET: http://api:3102
      HOST: 0.0.0.0
      SKIP_EXTRACT_NODES: "1"
    networks:
      - dafthunk-network
    restart: on-failure:5
    stdin_open: true
    tty: true

networks:
  dafthunk-network:
    driver: bridge

volumes:
  # 方案 I：按服务隔离 root + 包级 node_modules
  dafthunk_node_modules_api_root:
  dafthunk_node_modules_api:
  dafthunk_node_modules_api_mask_www:
  dafthunk_node_modules_api_mask_app:
  dafthunk_node_modules_www_root:
  dafthunk_node_modules_www:
  dafthunk_node_modules_www_mask_app:
  dafthunk_node_modules_www_mask_api:
  dafthunk_node_modules_app_root:
  dafthunk_node_modules_app:
  dafthunk_node_modules_app_mask_www:
  dafthunk_node_modules_app_mask_api:
  dafthunk_pnpm_store:
  dafthunk_postgres_data:
  dafthunk_local_storage:
  dafthunk_secrets:
