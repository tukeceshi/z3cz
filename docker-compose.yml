# Dafthunk 本地开发编排
#
# 启动：docker compose up -d --build --wait
# 状态：docker compose ps
# 重置：docker compose down -v
# 单容器：docker compose --profile monolith up -d --build

include:
  - path: docker-compose.dev.yml

services:
  monolith:
    profiles: ["monolith"]
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        NODE_VERSION: ${NODE_VERSION:-22.12.0}
        PNPM_VERSION: ${PNPM_VERSION:-10.3.0}
    container_name: dafthunk-dev-monolith
    depends_on:
      supabase-db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3100:3100"
      - "3101:3101"
      - "3102:3102"
    volumes:
      - .:/app
      # 单容器内隔离 root / 各包 node_modules（与四服务命名区分，避免混卷）
      - dafthunk_node_modules_mono_root:/app/node_modules
      - dafthunk_node_modules_mono_www:/app/apps/www/node_modules
      - dafthunk_node_modules_mono_app:/app/apps/app/node_modules
      - dafthunk_node_modules_mono_api:/app/apps/api/node_modules
      - dafthunk_pnpm_store:/pnpm/store
      - dafthunk_local_storage:/app/data/storage
      - dafthunk_secrets:/data/secrets
      - ./logs:/app/logs
    env_file:
      - path: .env.docker
        required: false
    environment:
      DAFTHUNK_SERVICE: monolith
      RUNTIME: docker
      SECRETS_FILE: /data/secrets/.dev.vars
      DATABASE_URL: postgresql://postgres:postgres@supabase-db:5432/postgres
      LOCAL_STORAGE_PATH: /app/data/storage
      HOST: 0.0.0.0
      SKIP_EXTRACT_NODES: "0"
    networks:
      - dafthunk-network
    command: pnpm dev:docker
    stdin_open: true
    tty: true

volumes:
  dafthunk_node_modules_mono_root:
  dafthunk_node_modules_mono_www:
  dafthunk_node_modules_mono_app:
  dafthunk_node_modules_mono_api:
