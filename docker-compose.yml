# Dafthunk 本地开发编排
#
# 端口：营销站 3100 | 产品 3101 | API 3102
# 快速启动见 README.md 或 docker/README.md

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        NODE_VERSION: ${NODE_VERSION:-20.19.0}
        PNPM_VERSION: ${PNPM_VERSION:-10.3.0}
    ports:
      - "3100:3100"
      - "3101:3101"
      - "3102:3102"
    volumes:
      - .:/app
      - dafthunk_node_modules:/app/node_modules
      - dafthunk_pnpm_store:/pnpm/store
    environment:
      CI: "true"
      RUN_DB_MIGRATE: ${RUN_DB_MIGRATE:-true}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    command: pnpm dev:docker
    stdin_open: true
    tty: true

  www:
    profiles: ["split"]
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        NODE_VERSION: ${NODE_VERSION:-20.19.0}
        PNPM_VERSION: ${PNPM_VERSION:-10.3.0}
    ports:
      - "3100:3100"
    volumes:
      - .:/app
      - dafthunk_node_modules:/app/node_modules
      - dafthunk_pnpm_store:/pnpm/store
    command: pnpm --filter '@dafthunk/www' dev

  app:
    profiles: ["split"]
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        NODE_VERSION: ${NODE_VERSION:-20.19.0}
        PNPM_VERSION: ${PNPM_VERSION:-10.3.0}
    ports:
      - "3101:3101"
    volumes:
      - .:/app
      - dafthunk_node_modules:/app/node_modules
      - dafthunk_pnpm_store:/pnpm/store
    command: pnpm --filter '@dafthunk/app' dev

  api:
    profiles: ["split"]
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        NODE_VERSION: ${NODE_VERSION:-20.19.0}
        PNPM_VERSION: ${PNPM_VERSION:-10.3.0}
    ports:
      - "3102:3102"
    volumes:
      - .:/app
      - dafthunk_node_modules:/app/node_modules
      - dafthunk_pnpm_store:/pnpm/store
    command: pnpm --filter '@dafthunk/api' dev:docker

volumes:
  dafthunk_node_modules:
  dafthunk_pnpm_store:
