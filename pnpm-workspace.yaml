# pnpm workspace roots — one shared pnpm-lock.yaml at repo root.
# After changing any package.json here, run: pnpm install (root) and commit pnpm-lock.yaml.
packages:
  - apps/app
  - apps/api
  - apps/www
  - apps/smtp-gateway
  - apps/persist-worker
  # Include all packages in the packages directory
  - packages/*
