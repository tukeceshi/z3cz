version: "1.0"
name: gitee-release
displayName: Gitee Release
triggers:
  trigger: auto
  push:
    tags:
      include:
        - ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$
stages:
  - stage:
    name: build-release
    displayName: 构建并发布 Gitee Release
    strategy: naturally
    trigger: auto
    steps:
      - step: build@nodejs
        name: build_gitee_release
        displayName: 构建部署包
        nodeVersion: 22.12.0
        commands:
          - corepack enable
          - corepack prepare pnpm@10.3.0 --activate
          - npm install --global bun@1.2.23
          - pnpm install --frozen-lockfile
          - bash scripts/release/build-gitee-release.sh
        artifacts:
          - name: GITEE_RELEASE_ASSETS
            path:
              - ./dist/deploy
              - ./RELEASE_NOTES.md
      - step: release@gitee
        name: release_gitee
        displayName: 发布 Gitee Release
        releaseName: ${RELEASE_TAG}
        description: RELEASE_NOTES.md
        tagName: ${RELEASE_TAG}
        upstreamArtifact:
          - GITEE_RELEASE_ASSETS
        assertFiles:
          - ./dist/deploy/z3cz-${RELEASE_TAG}-deploy.tar.gz
          - ./dist/deploy/SHA256SUMS
        prerelease: ${RELEASE_PRERELEASE}
        allowUpdate: false
